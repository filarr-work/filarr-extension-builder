<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="filarr-dev-token" content="__FILARR_DEV_TOKEN__" />
<title>Simulateur Filarr — extension</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f9; --panel:#fff; --border:#d9dee6; --text:#1e293b; --muted:#5b6576; --accent:#2f6fa8; --danger:#b42318; --warn:#9a5b00; --ok:#18794e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --panel:#121823; --border:#263042; --text:#e8eef7; --muted:#9aa7b8; --accent:#7fb6e6; --danger:#fca5a5; --warn:#fcd34d; --ok:#6ee7b7; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; white-space: nowrap; }
  label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  select, button, input[type=text] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #banner { padding: 6px 12px; border-bottom: 1px solid var(--border); display: none; white-space: pre-wrap; }
  #banner[data-type="error"] { display: block; color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  #banner[data-type="warn"] { display: block; color: var(--warn); }
  main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #stage { display: flex; gap: 8px; padding: 8px; min-height: 0; }
  .frame { flex: 1; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .frame-title { padding: 4px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .frame iframe { flex: 1; width: 100%; border: 0; background: transparent; }
  aside { border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .tabs button { border: 0; border-radius: 0; padding: 7px 10px; background: transparent; }
  .tabs button[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .tab { flex: 1; overflow: auto; padding: 8px 10px; display: none; }
  .tab[data-open="true"] { display: block; }
  .log-line { font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 2px 0; border-bottom: 1px dashed color-mix(in srgb, var(--border) 60%, transparent); overflow-wrap: anywhere; }
  .log-line[data-dir="out"] .dir { color: var(--accent); }
  .log-line[data-dir="in"] .dir { color: var(--ok); }
  .log-line[data-dir="warn"] { color: var(--warn); }
  .log-line[data-dir="error"] { color: var(--danger); }
  .muted { color: var(--muted); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin: 0 0 8px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  pre { margin: 4px 0; padding: 6px; background: color-mix(in srgb, var(--border) 25%, transparent); border-radius: 6px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
  .consent { border-color: var(--warn); }
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); min-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<header id="toolbar"></header>
<div id="banner"></div>
<main>
  <section id="stage"></section>
  <aside id="panel"></aside>
</main>
<script src="/client.js"></script>
</body>
</html>
